[workspace]
resolver = "2"
members = [
  "crates/tss-tsproto",
  "crates/tss-migration",
  "crates/tss-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Cloudwhile/tss-man"
authors = ["Cloudwhile"]

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.12", features = ["v7", "v4", "serde"] }
thiserror = "2.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
base64 = "0.22"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
russh = { version = "0.46", default-features = false, features = ["flate2"] }
sea-orm = { version = "1.1", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-native-tls", "macros", "with-chrono", "with-json"] }
sea-orm-migration = { version = "1.1", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-native-tls"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
jsonwebtoken = "9.3"
totp-rs = { version = "5.6", features = ["qr", "gen_secret"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
cron = "0.13"
rust-embed = "8.5"
mime_guess = "2.0"
dotenvy = "0.15"
