<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="text-scale" content="scale" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var pref = localStorage.getItem('color-scheme');
        var meta = document.querySelector('meta[name="color-scheme"]');
        if (pref === 'light' || pref === 'dark') {
          if (meta) meta.content = pref;
          document.documentElement.dataset.theme = pref;
        } else {
          if (meta) meta.content = 'light dark';
          delete document.documentElement.dataset.theme;
        }
        var savedLang = localStorage.getItem('tss-lang');
        if (savedLang === 'en-US' || savedLang === 'zh-CN') {
          document.documentElement.lang = savedLang;
        }
      } catch (e) {}
    </script>
    <title>TSS Manager · TeamSpeak 管控台</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230067b2'/%3E%3Cpath d='M9 18v-2a7 7 0 0 1 14 0v2' fill='none' stroke='%23ffffff' stroke-width='2.5' stroke-linecap='round'/%3E%3Crect x='7' y='17' width='4' height='7' rx='2' fill='%23ffffff'/%3E%3Crect x='21' y='17' width='4' height='7' rx='2' fill='%23ffffff'/%3E%3C/svg%3E"
    />
  </head>
  <body class="bg-surface text-text antialiased selection:bg-action-subtle selection:text-action-text">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
